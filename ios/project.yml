# XcodeGen spec. On a Mac: `brew install xcodegen`, then `xcodegen generate` here creates DropTray.xcodeproj.
name: DropTray
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DROPTRAY_BUNDLE_ID: com.technoquantum.droptray   # change to your own, e.g. com.yourname.droptray
    DEVELOPMENT_TEAM: ""                              # or pick your team in Xcode > Signing & Capabilities
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  DropTray:
    type: application
    platform: iOS
    sources: [DropTray, Shared]
    info:
      path: DropTray/Info.plist
      properties:
        CFBundleDisplayName: DropTray
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: DropTray finds and talks to DropTray on your PC over your network.
        NSBonjourServices: [_droptray._tcp]
        NSCameraUsageDescription: Scan the pairing QR code shown by DropTray on your PC.
        NSPhotoLibraryAddUsageDescription: Save photos and videos your PC shares into your library.
        NSAppTransportSecurity: {NSAllowsLocalNetworking: true}
        DropTrayKeychainGroup: $(AppIdentifierPrefix)$(DROPTRAY_BUNDLE_ID).shared
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: DropTray/DropTray.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)$(DROPTRAY_BUNDLE_ID).shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DROPTRAY_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: DropTrayShare
  DropTrayShare:
    type: app-extension
    platform: iOS
    sources: [ShareExtension, Shared]
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: DropTray
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocalNetworkUsageDescription: DropTray sends what you share to DropTray on your PC.
        NSAppTransportSecurity: {NSAllowsLocalNetworking: true}
        DropTrayKeychainGroup: $(AppIdentifierPrefix)$(DROPTRAY_BUNDLE_ID).shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 200
              NSExtensionActivationSupportsMovieWithMaxCount: 50
              NSExtensionActivationSupportsFileWithMaxCount: 100
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: ShareExtension/DropTrayShare.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)$(DROPTRAY_BUNDLE_ID).shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DROPTRAY_BUNDLE_ID).share
