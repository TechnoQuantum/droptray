ShortDescription: Send files, text and the clipboard between an iPhone and Windows over your local network.
Description: |-
  A tray app with a glass drawer for Windows 11, plus a web page for the iPhone (no app to install).
  Accept or decline each transfer, see progress and speed, browse history, send files back to the phone,
  share the clipboard both ways, and pair several phones and PCs that find each other with Bonjour.
