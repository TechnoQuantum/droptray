<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DropTray widget</title>
<style>
  /* The window itself is cut to a circle; this page draws the ring and the mark inside it.
     Ring colours: green receiving, blue sending, yellow half clipboard synced, red failed, orange waiting. */
  :root { --ring: #30d158; --track: rgba(255,255,255,.13); --p: 0; }
  html, body { margin: 0; height: 100%; overflow: hidden; user-select: none; cursor: default; }
  body { background: radial-gradient(circle at 50% 35%, rgba(255,255,255,.10), rgba(20,20,26,.30) 70%); }
  .ring { position: absolute; inset: 3px; border-radius: 50%; opacity: 0; transition: opacity .3s;
          background: conic-gradient(from -90deg, var(--ring) calc(var(--p) * 1turn), var(--track) 0);
          -webkit-mask: radial-gradient(circle, transparent 61%, #000 62%); mask: radial-gradient(circle, transparent 61%, #000 62%); }
  .mark { position: absolute; left: 50%; top: 50%; width: 32px; height: 32px; margin: -16px 0 0 -16px; border-radius: 50%;
          display: grid; place-items: center; transition: transform .2s, filter .3s;
          background: linear-gradient(160deg, #64d2ff, #0a84ff); box-shadow: 0 4px 14px -4px rgba(10,132,255,.9), inset 0 1px 0 rgba(255,255,255,.4); }
  body:hover .mark { transform: scale(1.08); }
  .badge { position: absolute; top: 4px; right: 4px; min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box;
           border-radius: 8px; background: #ff9f0a; color: #fff; font: 700 10px/16px "Segoe UI", sans-serif; text-align: center;
           box-shadow: 0 0 0 2px rgba(20,20,26,.7); display: none; }

  body.recv .ring, body.send .ring, body.clip .ring, body.done .ring, body.error .ring, body.ask .ring { opacity: 1; }
  body.recv { --ring: #30d158; }
  body.send { --ring: #0a84ff; }
  body.done { --ring: #30d158; --p: 1; }
  body.error { --ring: #ff453a; --p: 1; }
  body.clip { --ring: #ffd60a; --p: .5; }
  body.ask { --ring: #ff9f0a; --p: 1; }
  body.ask .badge { display: block; animation: pulse 1.6s ease-in-out infinite; }
  body.ask .ring, body.done .ring, body.error .ring { animation: breathe 1.8s ease-in-out infinite; }
  body.recv .mark { background: linear-gradient(160deg, #5be37d, #30d158); box-shadow: 0 4px 14px -4px rgba(48,209,88,.9), inset 0 1px 0 rgba(255,255,255,.4); }
  body.error .mark { background: linear-gradient(160deg, #ff6961, #ff453a); box-shadow: none; }
  body.paused .mark { filter: grayscale(1) brightness(.75); }
  /* progress unknown: a quarter arc goes round */
  body.spin { --p: .25; }
  body.spin .ring { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { transform: scale(1.18); } }
  @keyframes breathe { 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { .ring, .badge { animation: none !important; } }
</style>
</head>
<body title="DropTray">
<div class="ring"></div>
<div class="mark">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3.5v11"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M4 15.5v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
  </svg>
</div>
<div class="badge" id="badge"></div>
<script>
const api = () => window.pywebview.api;
// Press: Python decides between a drag (the button is still held) and a click.
document.addEventListener("mousedown", (e) => { if (e.button === 0) api().widget_press(); });
document.addEventListener("contextmenu", (e) => { e.preventDefault(); api().widget_press(); });
async function tick() {
  try {
    const s = await api().widget_state();
    const moving = s.state === "recv" || s.state === "send";
    document.body.className = s.state + (moving && s.frac <= 0.001 ? " spin" : "");
    if (moving && s.frac > 0.001) document.body.style.setProperty("--p", Math.max(0.03, s.frac));
    else document.body.style.removeProperty("--p");
    document.getElementById("badge").textContent = s.pending || "";
    document.body.title = s.tip;
    setTimeout(tick, s.state === "idle" ? 600 : 300);
  } catch (e) { setTimeout(tick, 1500); }
}
window.addEventListener("pywebviewready", tick);
</script>
</body>
</html>
